name: Deploy to shinyapps.io

on:
  push:
    branches: [edward-auto]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'deploy/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libuv1-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rsconnect", "curl", "jsonlite", "dplyr", "lubridate", "ggplot2", "ggrepel", "shiny", "bslib", "DT"), repos = "https://cloud.r-project.org")'

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          # Optional. Add repo secret OPENFDA_API_KEY to raise the deployed app's
          # openFDA rate limit (~1k/day anonymous -> ~120k/day). Absent = anonymous,
          # which is exactly the behaviour before this was added.
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = "mmdothim",
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            args <- list(
              appDir      = ".",
              appName     = "PRISMPV",
              account     = "mmdothim",
              server      = "shinyapps.io",
              forceUpdate = TRUE
            )
            # Push the key to the server as an env var (its VALUE is never written
            # into the bundle — this repo is public). Only added when the secret is
            # actually set, so the deploy is unchanged until then.
            if (nzchar(Sys.getenv("OPENFDA_API_KEY", ""))) {
              args$envVars <- "OPENFDA_API_KEY"
              cat("openFDA API key present — deploying with envVars\n")
            } else {
              cat("no openFDA API key set — deploying with anonymous rate limits\n")
            }
            do.call(rsconnect::deployApp, args)
          '

      - name: Smoke test deployed app (fail if unhealthy)
        run: |
          url="https://mmdothim.shinyapps.io/PRISMPV/"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/prism_body.html -w '%{http_code}' --max-time 30 "$url" || echo 000)
            if [ "$code" = "200" ] && grep -qi '<title>PRISM</title>' /tmp/prism_body.html; then
              echo "PASS: smoke test ok on attempt $i (HTTP 200, PRISM title present)"
              exit 0
            fi
            echo "attempt $i: http_code=$code — not healthy yet, retrying in 15s"
            sleep 15
          done
          echo "FAIL: deployed app never returned a healthy PRISM page"
          echo "--- last response (first 2KB) ---"
          head -c 2048 /tmp/prism_body.html || true
          exit 1
