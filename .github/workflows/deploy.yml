name: Deploy to shinyapps.io

on:
  push:
    branches: [edward-auto]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'deploy/**'

# Only one deploy at a time. The auto-sync watcher commits every minute but a
# deploy takes ~10, so runs used to overlap constantly — and shinyapps.io rejects
# a second concurrent deploy of the same app, so the LATER run always went red.
# That produced the long-standing alternating success/failure pattern in the run
# history (e.g. 2026-08-24 bfb27ae ok / cf401b8 red / b4f8586 ok / 5ea4f6b red),
# which had nothing to do with app health and made red runs easy to ignore.
# cancel-in-progress is correct here because this pipeline is latest-wins: a
# superseded commit has no value once a newer one is queued.
concurrency:
  group: deploy-shinyapps-prismpv
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libuv1-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("rsconnect", "curl", "jsonlite", "dplyr", "lubridate", "ggplot2", "ggrepel", "shiny", "bslib", "DT"), repos = "https://cloud.r-project.org")'

      - name: Inject openFDA API key into the bundle
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: |
          # shinyapps.io supports NO secure environment variables. rsconnect's
          # deployApp(envVars=) is Posit Connect only and ERRORS on shinyapps —
          # that is exactly what turned run 20e8ede red the moment the secret
          # first existed. See rsconnect docs: "Secure environment variables are
          # currently only supported by Posit Connect".
          #
          # Supported alternative: Shiny auto-sources every file in an app's R/
          # directory before app.R, so a generated file there can set the variable
          # in-process. Generated here in CI only, on a throwaway runner — never on
          # edward, and gitignored so it can never be committed to this PUBLIC repo.
          #
          # TRADEOFF, stated plainly: this puts the key in plaintext inside the
          # bundle stored on Posit's servers under the mmdothim account. Acceptable
          # for an openFDA key (rate-limit token only: no data access, no billing,
          # free to regenerate). Do NOT reuse this pattern for a real credential.
          if [ -n "${OPENFDA_API_KEY}" ]; then
            printf 'Sys.setenv(OPENFDA_API_KEY = "%s")\n' "${OPENFDA_API_KEY}" > R/zzz_env.R
            echo "openFDA API key present — injected into bundle as R/zzz_env.R"
          else
            echo "no openFDA API key set — deploying with anonymous rate limits"
          fi

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = "mmdothim",
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            rsconnect::deployApp(
              appDir      = ".",
              appName     = "PRISMPV",
              account     = "mmdothim",
              server      = "shinyapps.io",
              forceUpdate = TRUE
            )
          '

      - name: Smoke test deployed app (fail if unhealthy)
        run: |
          url="https://mmdothim.shinyapps.io/PRISMPV/"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/prism_body.html -w '%{http_code}' --max-time 30 "$url" || echo 000)
            if [ "$code" = "200" ] && grep -qi '<title>PRISM</title>' /tmp/prism_body.html; then
              echo "PASS: smoke test ok on attempt $i (HTTP 200, PRISM title present)"
              exit 0
            fi
            echo "attempt $i: http_code=$code — not healthy yet, retrying in 15s"
            sleep 15
          done
          echo "FAIL: deployed app never returned a healthy PRISM page"
          echo "--- last response (first 2KB) ---"
          head -c 2048 /tmp/prism_body.html || true
          exit 1
